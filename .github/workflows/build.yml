# Builds and tests every push to main and every pull request (build.ps1: the self-test, then the
# .msi), so a broken build shows before a release. The installer is kept as a workflow artifact
# for 14 days; releases are made by release.yml. Origin: written for this project.

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build (self-test, then the installer)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: TC001MaxWebcam-*-x64.msi
          retention-days: 14
